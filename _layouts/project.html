---
layout: default
---
<article>
  <header class="article-header">
    <h1>{{ page.title }}</h1>
    <div class="article-meta">
      {% if page.status %}<span class="tag">{{ page.status }}</span>{% endif %}
      {% if page.tech %}
        {% for t in page.tech %}<span class="tag">{{ t }}</span>{% endfor %}
      {% endif %}
      {% if page.url_live %}<span><a href="{{ page.url_live }}">Live Demo →</a></span>{% endif %}
      {% if page.url_repo %}<span><a href="{{ page.url_repo }}">Source Code →</a></span>{% endif %}
    </div>
  </header>

  <div class="article-content">
    {{ content }}
  </div>
</article>
